services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: law-system-app
    container_name: law-system-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_URL: http://localhost:8080
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - ./:/var/www
    networks:
      - law-network

  web:
    image: nginx:alpine
    container_name: law-system-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - law-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: law-system-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-law_system_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-0000}
    ports:
      - "33070:3306"
    volumes:
      - db-data:/var/lib/mysql
      # Auto-import schema and data on first run
      - ./database/docker_init_dump.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - law-network

  # Reverb WebSockets (Real-time features)
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: law-system-app
    container_name: law-system-reverb
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_URL: http://localhost:8080
      DB_HOST: db
      REDIS_HOST: redis
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8081:8080"
    volumes:
      - ./:/var/www
    networks:
      - law-network
    depends_on:
      - app

networks:
  law-network:
    driver: bridge

volumes:
  db-data:
